name: Privacy scan

# Privacy is the core of this plugin: nothing may leave the device. This builds the
# exact main.js that ships and fails if it gained a package, runtime module, network
# call, host or telemetry hook that isn't reviewed in scripts/privacy-allowlist.json.
# It runs on every PR (including the weekly dependency upgrade), on every push, and
# weekly on main so a change in how a dependency resolves can't slip in unnoticed.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Scan the bundle for anything that can leave the device
        run: npm run privacy:scan
